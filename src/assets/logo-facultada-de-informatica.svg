<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
	<circle cx="150" cy="150" r="148" fill="#ffffff"/>
	<circle cx="150" cy="150" r="148" fill="none" stroke="#911e29" stroke-width="4"/>

	<!-- radius 128 (not 115) — the bottom string measures ~357px at this
	     font-size/spacing, and a 115-radius semicircle only offers ~361px
	     of arc, so it was overlapping itself right at the end ("PLATA"
	     rendering as "PLAIA"). 128 gives ~402px, a real margin instead of
	     a coin-flip. Both arcs now share the same center/endpoints instead
	     of the old vertically-offset pair — text nowhere near full length
	     naturally leaves a gap at the seams, so the offset wasn't needed. -->
	<path id="fiTopArc" d="M22,150 A128,128 0 0 1 278,150" fill="none"/>
	<path id="fiBottomArc" d="M22,150 A128,128 0 0 0 278,150" fill="none"/>

	<text font-family="Georgia, 'Times New Roman', serif" fill="#1a1a1a" letter-spacing="0.8">
		<textPath href="#fiTopArc" startOffset="50%" text-anchor="middle" font-size="23">
			<tspan font-weight="400" font-style="italic">Facultad de </tspan><tspan font-weight="700">INFORMÁTICA</tspan>
		</textPath>
	</text>
	<text font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1a1a1a" letter-spacing="1">
		<textPath href="#fiBottomArc" startOffset="50%" text-anchor="middle" font-size="17">UNIVERSIDAD NACIONAL DE LA PLATA</textPath>
	</text>

	<circle cx="22" cy="150" r="3" fill="#911e29"/>
	<circle cx="278" cy="150" r="3" fill="#911e29"/>

